<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小数のしくみ 習熟ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --main:#3DAA6E; --accent:#E8913A; --box:#3DAA6E; --sum:#FFF9E6;
  --int:#FCE4D6; --dec:#DAEEF3; --bg:#F8FAFB; --text:#1A1A1A; --wrong:#D94F4F;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;cursor:pointer;}
.app{display:flex;flex-direction:column;min-height:100vh;}

/* header */
.header{background:var(--main);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.header h1{font-size:1.05rem;margin:0;font-weight:700;}
.progress-wrap{flex:1;min-width:180px;max-width:360px;}
.progress-label{font-size:0.75rem;margin-bottom:2px;}
.progress-bar{background:rgba(255,255,255,0.35);border-radius:8px;height:12px;overflow:hidden;}
.progress-fill{background:#fff;height:100%;width:0%;transition:width .4s;}
.random-btn{background:var(--accent);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-weight:700;font-size:0.8rem;}

/* layout */
.main{display:flex;flex:1;}
.tabs{display:flex;flex-direction:column;background:#fff;border-right:1px solid #ddd;min-width:120px;}
.tab-btn{border:none;background:transparent;padding:16px 10px;text-align:left;font-size:0.85rem;font-weight:700;color:#555;border-left:4px solid transparent;}
.tab-btn.active{color:var(--main);border-left-color:var(--main);background:#EFFAF3;}
.content{flex:1;padding:16px;overflow-x:hidden;}

@media (max-width:768px){
  .main{flex-direction:column;}
  .tabs{flex-direction:row;overflow-x:auto;min-width:auto;border-right:none;border-bottom:1px solid #ddd;}
  .tab-btn{border-left:none;border-bottom:4px solid transparent;white-space:nowrap;}
  .tab-btn.active{border-left-color:transparent;border-bottom-color:var(--main);}
}

/* problem box */
.problem-box{border:3px solid var(--box);border-radius:14px;padding:16px;background:#fff;max-width:760px;margin:0 auto 14px;}
.q-badge{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;margin-right:8px;font-size:0.85rem;}
.q-text{font-size:1.2rem;font-weight:700;display:inline;}
.numbox{font-family:'Courier New',monospace;font-size:1.6rem;font-weight:700;}

.controls{max-width:760px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
input[type=number]{font-family:'Courier New',monospace;font-size:1.4rem;padding:8px 10px;width:140px;border:2px solid #aaa;border-radius:8px;}
.btn{border:none;border-radius:8px;padding:10px 20px;font-weight:700;font-size:0.95rem;color:#fff;background:var(--main);}
.btn.secondary{background:#888;}
.btn.outline{background:#fff;color:var(--main);border:2px solid var(--main);}
.hint-btn{background:none;border:2px solid var(--accent);color:var(--accent);border-radius:20px;padding:6px 14px;font-size:0.8rem;font-weight:700;}
.hint-box{background:var(--sum);border:2px solid var(--accent);border-radius:10px;padding:12px;max-width:760px;margin:10px auto;font-size:0.95rem;display:none;}
.hint-box.show{display:block;}

.feedback{max-width:760px;margin:10px auto;font-size:1.3rem;font-weight:900;min-height:1.6em;}
.feedback.correct{color:var(--main);}
.feedback.wrong{color:var(--wrong);}

@keyframes pop{0%{transform:scale(0.4);opacity:0;}60%{transform:scale(1.15);}100%{transform:scale(1);opacity:1;}}
.pop-in{animation:pop .35s ease-out;}

/* place value table mode1 */
.place-table{display:flex;justify-content:center;gap:0;margin:18px auto;max-width:560px;}
.pcell{width:64px;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #bbb;font-family:'Courier New',monospace;font-size:1.4rem;font-weight:700;transition:transform .5s;}
.pcell.intpart{background:var(--int);}
.pcell.decpart{background:var(--dec);}
.pcell .lbl{font-size:0.55rem;font-weight:400;color:#555;}
.pcell.point{background:#fff;border:none;width:14px;font-size:1.4rem;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
.slide-left{transform:translateX(-64px);}
.slide-right{transform:translateX(64px);}

/* mode2 number-line / pochi */
svg text{font-family:'Noto Sans JP',sans-serif;user-select:none;}
.pochi{cursor:pointer;}
.digit-col{font-family:'Courier New',monospace;font-size:1.5rem;font-weight:700;}

/* numpad */
.numpad-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);display:none;align-items:center;justify-content:center;z-index:50;}
.numpad-overlay.show{display:flex;}
.numpad{background:#fff;border-radius:14px;padding:14px;display:grid;grid-template-columns:repeat(3,64px);gap:8px;}
.numpad button{width:64px;height:54px;font-size:1.3rem;font-weight:700;border:1px solid #ccc;border-radius:8px;background:#f5f5f5;}
.numpad button.clear{background:#eee;color:var(--wrong);}
.numpad button.close{grid-column:span 3;background:var(--main);color:#fff;}

/* hissan grid */
.hissan-table{border-collapse:collapse;margin:14px auto;font-family:'Courier New',monospace;font-size:1.5rem;font-weight:700;}
.hissan-table td{width:42px;height:46px;text-align:center;border:none;}
.hissan-table td.given{color:#888;}
.hissan-table td.point{font-weight:900;}
.hissan-table tr.opline td{border-bottom:2px solid #333;}
.hissan-table td.input-cell{border:2px solid #999;border-radius:6px;cursor:pointer;background:#fff;}
.hissan-table td.input-cell.filled{color:var(--main);}
.hissan-table td.op-sign{color:#333;}

/* summary modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:60;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:420px;width:90%;text-align:center;}
.bar-row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:0.85rem;}
.bar-track{flex:1;background:#eee;border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{background:var(--main);height:100%;}

.tag{display:inline-block;background:var(--int);border-radius:14px;padding:4px 10px;font-size:0.8rem;margin:2px;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>小数のしくみを調べよう</h1>
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">① 小数点移動　0 / 30 もんせいかい</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>
    <button class="random-btn" id="randomBtn">ランダムにまぜてとく</button>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab-btn active" data-mode="1">① 小数点移動</button>
      <button class="tab-btn" data-mode="2">② 単位変換</button>
      <button class="tab-btn" data-mode="3">③ 数直線</button>
      <button class="tab-btn" data-mode="4">④ 筆算</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="numpad-overlay" id="numpadOverlay">
  <div class="numpad" id="numpad"></div>
</div>

<div class="modal-overlay" id="summaryOverlay">
  <div class="modal" id="summaryModal"></div>
</div>

<script>
/* ===================== データ生成 ===================== */

function buildMode1(){
  const ops = ['×10','×100','×1000','÷10','÷100','÷1000'];
  const bases = {
    '×10':   [0.074,0.236,1.508,0.9,2.05,3.1,0.003,0.46,7.2,0.018],
    '×100':  [0.074,0.0236,1.508,0.009,0.052,3.1,0.0083,0.046,7.2,0.0018],
    '×1000': [0.074,0.00236,0.0015,0.009,0.0052,0.31,0.00083,0.0046,0.72,0.00018],
    '÷10':   [74,236,1508,9,205,3.1,3,46,72,18],
    '÷100':  [74,236,1508,9,520,310,830,460,7200,180],
    '÷1000': [740,2360,15080,9000,5200,3100,8300,4600,72000,1800]
  };
  let id=1; const list=[];
  ops.forEach(op=>{
    for(let i=0;i<5;i++){
      const orig = bases[op][i];
      let answer;
      if(op[0]==='×') answer = orig*parseInt(op.slice(1));
      else answer = orig/parseInt(op.slice(1));
      answer = Math.round(answer*1000000)/1000000;
      const moveCount = op.includes('1000')?3:op.includes('100')?2:1;
      const dir = op[0]==='×'?'右':'左';
      list.push({
        id:id++, original:orig, operation:op, answer:answer,
        hint:`${op}すると、小数点が${dir}に${moveCount}つ動くよ。`,
        type:op
      });
    }
  });
  return list;
}

function buildMode2(){
  const list=[];
  let id=1;
  const kmM = [[1,325],[2,15],[3,5],[1,80],[4,250],[2,3],[1,907],[3,40],[2,650],[1,8]];
  const mOnly = [2015,3470,1050,8200,4005,1230,2980,5500,1009,6750];
  const kgG = [[3,284],[1,500],[2,75],[5,9],[1,830],[4,60],[2,205],[1,40],[3,750],[2,8]];
  const gOnly = [927,1500,350,4200,80,615,990,1075,250,3400];
  kmM.forEach(([km,m])=>{
    list.push({id:id++, display:`${km}km${m}m`, targetUnit:'km', digits:String(km*1000+m).padStart(4,'0').split('').map(Number),
      pochiIndex:1, answer:Number((km+m/1000).toFixed(3)), unitType:'length',
      hint:'kmで表したいから、kmのポチを点灯！'});
  });
  mOnly.forEach(m=>{
    list.push({id:id++, display:`${m}m`, targetUnit:'km', digits:String(m).padStart(4,'0').split('').map(Number),
      pochiIndex:1, answer:Number((m/1000).toFixed(3)), unitType:'length',
      hint:'mをkmで表したいから、kmのポチを点灯！'});
  });
  kgG.forEach(([kg,g])=>{
    list.push({id:id++, display:`${kg}kg${g}g`, targetUnit:'kg', digits:String(kg*1000+g).padStart(4,'0').split('').map(Number),
      pochiIndex:1, answer:Number((kg+g/1000).toFixed(3)), unitType:'weight',
      hint:'kgで表したいから、kgのポチを点灯！'});
  });
  gOnly.forEach(g=>{
    list.push({id:id++, display:`${g}g`, targetUnit:'kg', digits:String(g).padStart(4,'0').split('').map(Number),
      pochiIndex:1, answer:Number((g/1000).toFixed(3)), unitType:'weight',
      hint:'gをkgで表したいから、kgのポチを点灯！'});
  });
  const kmRev = [2.015,1.325,3.5,1.08,4.25,2.003,1.907,3.04,2.65,1.008];
  kmRev.forEach(km=>{
    const m = Math.round(km*1000);
    list.push({id:id++, display:`${km}km`, targetUnit:'m', digits:String(m).padStart(4,'0').split('').map(Number),
      pochiIndex:2, answer:m, unitType:'length',
      hint:'mで表したいから、mのポチを点灯！'});
  });
  const kgRev = [3.284,1.5,2.075,5.009,1.83,4.06,2.205,1.04,3.75,2.008];
  kgRev.forEach(kg=>{
    const g = Math.round(kg*1000);
    list.push({id:id++, display:`${kg}kg`, targetUnit:'g', digits:String(g).padStart(4,'0').split('').map(Number),
      pochiIndex:2, answer:g, unitType:'weight',
      hint:'gで表したいから、gのポチを点灯！'});
  });
  return list;
}

function buildMode3(){
  const list=[]; let id=1;
  // A: 目盛り読み取り (15)
  const readRanges = [
    {min:0,max:0.1,step:0.001,marks:{ア:0.008,イ:0.035,ウ:0.062,エ:0.091}},
    {min:0,max:0.9,step:0.01,marks:{ア:0.12,イ:0.34,ウ:0.58,エ:0.76}},
    {min:1,max:2,step:0.01,marks:{ア:1.08,イ:1.25,ウ:1.55,エ:1.83}},
    {min:1,max:1.8,step:0.001,marks:{ア:1.43,イ:1.435,ウ:1.46,エ:1.79}},
    {min:4.29,max:4.31,step:0.001,marks:{ア:4.293,イ:4.30,ウ:4.305,エ:4.31}}
  ];
  readRanges.forEach(r=>{
    Object.entries(r.marks).forEach(([label,val])=>{
      list.push({id:id++, kind:'read', min:r.min, max:r.max, step:r.step, marks:r.marks,
        targetLabel:label, answer:Number(val.toFixed(3)),
        hint:`1めもりの大きさは${r.step}だよ。${label}が0の目盛りからいくつ分かを数えよう。`});
    });
  });
  // B: 矢印を立てる (15)
  const placeRanges = [
    {min:0,max:0.1,step:0.001,vals:[0.008,0.01,0.006,0.02,0.095]},
    {min:0,max:1,step:0.01,vals:[0.55,1.08,0.34,0.7,0.91]},
    {min:0,max:2,step:0.01,vals:[1.25,0.65,1.9,0.05,1.5]}
  ];
  let cnt=0;
  placeRanges.forEach(r=>{
    r.vals.forEach(v=>{
      cnt++;
      list.push({id:id++, kind:'place', min:r.min, max:r.max, step:r.step,
        target:v, answer:v, hint:`${v}は0から${Math.round(v/r.step)}めもり分の場所だよ。`});
    });
  });
  return list;
}

function buildMode4(){
  const list=[]; let id=1;
  const addSame=[[2.38,4.56],[1.27,3.45],[5.62,2.19],[0.83,0.46],[3.14,1.59]];
  const addDiff=[[3.6,0.835],[2.4,1.06],[5.2,0.345],[1.08,2.3],[4.05,0.6]];
  const addInt=[[6,0.42],[3,1.275],[5,0.8],[2,3.65],[7,0.09]];
  const subSame=[[6.85,5.96],[4.73,2.18],[8.91,3.47],[5.5,2.5],[7.62,4.38]];
  const subDiff=[[5.76,3.2],[6.4,1.85],[3.5,0.62],[8.2,5.075],[4.6,0.38]];
  const subZero=[[3.03,0.83],[2.0,0.45],[5.07,2.4],[1.005,0.7],[6.0,3.125]];
  function pushAdd(arr){arr.forEach(([a,b])=>{list.push({id:id++,op:'+',a,b,answer:Math.round((a+b)*1000)/1000});});}
  function pushSub(arr){arr.forEach(([a,b])=>{list.push({id:id++,op:'-',a,b,answer:Math.round((a-b)*1000)/1000});});}
  pushAdd(addSame); pushAdd(addDiff); pushAdd(addInt);
  pushSub(subSame); pushSub(subDiff); pushSub(subZero);
  return list;
}

const QUESTIONS = { 1:buildMode1(), 2:buildMode2(), 3:buildMode3(), 4:buildMode4() };

/* ===================== 進捗管理 ===================== */
function defaultProgress(){
  return {
    1:{total:30,correct:0,wrong:[],current:0,wrongStreak:{}},
    2:{total:30,correct:0,wrong:[],current:0,wrongStreak:{}},
    3:{total:30,correct:0,wrong:[],current:0,wrongStreak:{}},
    4:{total:30,correct:0,wrong:[],current:0,wrongStreak:{}}
  };
}
let progress = JSON.parse(sessionStorage.getItem('progress')||'null') || defaultProgress();
function saveProgress(){ sessionStorage.setItem('progress', JSON.stringify(progress)); }

let currentMode = 1;
let randomQueue = null; // {mode,q} list when in random mode
let randomPos = 0;
let activeQuestionOverride = null; // for retry-wrong mode

const content = document.getElementById('content');
const numpadOverlay = document.getElementById('numpadOverlay');
const numpad = document.getElementById('numpad');
const summaryOverlay = document.getElementById('summaryOverlay');
const summaryModal = document.getElementById('summaryModal');

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = parseInt(btn.dataset.mode);
    randomQueue = null; activeQuestionOverride=null;
    renderProgress();
    renderQuestion();
  });
});
document.getElementById('randomBtn').addEventListener('click', startRandomMode);

function modeName(m){ return {1:'① 小数点移動',2:'② 単位変換',3:'③ 数直線',4:'④ 筆算'}[m]; }

function renderProgress(){
  const p = progress[currentMode];
  document.getElementById('progressLabel').textContent =
    `${modeName(currentMode)}　${p.correct} / ${p.total} もんせいかい ✓`;
  document.getElementById('progressFill').style.width = (p.correct/p.total*100)+'%';
}

function getCurrentQuestion(){
  if(activeQuestionOverride) return activeQuestionOverride;
  if(randomQueue){
    if(randomPos>=randomQueue.length) return null;
    return randomQueue[randomPos];
  }
  const p = progress[currentMode];
  if(p.current>=QUESTIONS[currentMode].length) return null;
  return {mode:currentMode, q:QUESTIONS[currentMode][p.current]};
}

function advanceQuestion(){
  if(activeQuestionOverride){ activeQuestionOverride=null; renderQuestion(); return; }
  if(randomQueue){ randomPos++; renderQuestion(); return; }
  progress[currentMode].current++;
  saveProgress();
  renderQuestion();
}

function markResult(mode, qid, ok){
  const p = progress[mode];
  if(ok){
    p.correct++;
    p.wrong = p.wrong.filter(x=>x!==qid);
  } else {
    p.wrongStreak[qid] = (p.wrongStreak[qid]||0)+1;
    if(!p.wrong.includes(qid)) p.wrong.push(qid);
  }
  saveProgress();
}

function startRandomMode(){
  let pool = [];
  [1,2,3,4].forEach(m=>{
    QUESTIONS[m].forEach(q=>pool.push({mode:m,q}));
  });
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  randomQueue = pool; randomPos=0;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('progressLabel').textContent = 'ランダムもんだい';
  document.getElementById('progressFill').style.width = '0%';
  renderQuestion();
}

function retryWrong(mode){
  const wrongIds = progress[mode].wrong;
  if(wrongIds.length===0){ renderQuestion(); return; }
  const qs = QUESTIONS[mode].filter(q=>wrongIds.includes(q.id));
  randomQueue = qs.map(q=>({mode,q}));
  randomPos = 0;
  renderQuestion();
}

/* ===================== レンダリング ルーター ===================== */
function renderQuestion(){
  const cur = getCurrentQuestion();
  if(!cur){
    renderSummary(currentMode);
    return;
  }
  const mode = cur.mode!==undefined ? cur.mode : currentMode;
  const q = cur.q;
  if(mode===1) renderMode1(q, mode);
  else if(mode===2) renderMode2(q, mode);
  else if(mode===3) renderMode3(q, mode);
  else if(mode===4) renderMode4(q, mode);
}
renderProgress();
renderQuestion();

function qBoxOpen(mode, q, idx, total, text){
  return `<div class="problem-box">
    <span class="q-badge">${idx}</span><span class="q-text">${text}</span>
    <div style="margin-top:8px;"><button class="hint-btn" id="hintBtn">💡 ヒントを見る</button></div>
    <div class="hint-box" id="hintBox">${q.hint||''}</div>
  </div>`;
}
function attachHint(){
  const hb = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(hb) hb.addEventListener('click',()=>box.classList.toggle('show'));
}
function feedbackEl(){ return `<div class="feedback" id="feedback"></div>`; }

function showFeedback(ok, correctAnswerText){
  const fb = document.getElementById('feedback');
  if(ok){
    fb.className='feedback correct pop-in';
    fb.textContent='〇 せいかい！';
    setTimeout(advanceQuestion, 900);
  } else {
    fb.className='feedback wrong pop-in';
    fb.textContent = '✗ もういちど';
  }
}

function wrongStreakOf(mode,qid){ return progress[mode].wrongStreak[qid]||0; }

/* ===================== モード①：小数点移動 ===================== */
function renderMode1(q, mode){
  const idx = (progress[mode].current%QUESTIONS[1].length)+1;
  content.innerHTML = `
    ${qBoxOpen(mode,q,idx,30,`${q.original} を ${q.operation} した数はいくつですか。`)}
    <div class="place-table" id="placeTable"></div>
    <div class="controls">
      <input type="number" step="any" id="ansInput" placeholder="こたえ">
      <button class="btn" id="checkBtn">こたえる</button>
    </div>
    ${feedbackEl()}
  `;
  attachHint();
  drawPlaceTable(q.original);
  document.getElementById('checkBtn').addEventListener('click', ()=>{
    const v = parseFloat(document.getElementById('ansInput').value);
    const ok = Math.abs(v - q.answer) < 1e-9;
    markResult(mode, q.id, ok);
    showFeedback(ok);
    if(ok){
      animateSlide(q.operation);
      const fb = document.getElementById('feedback');
      const dir = q.operation[0]==='×'?'右':'左';
      const cnt = q.operation.includes('1000')?3:q.operation.includes('100')?2:1;
      fb.innerHTML += `<div style="font-size:0.9rem;color:#555;margin-top:4px;">ポチが${cnt}つ${dir}に動いた！</div>`;
    } else if(wrongStreakOf(mode,q.id)>=3){
      document.getElementById('feedback').innerHTML += `<div style="font-size:0.9rem;">正解は <b>${q.answer}</b> だよ。${q.hint}</div>`;
    }
  });
}
function digitsOfPlace(num){
  // returns {hundreds,tens,ones,d1,d2,d3}
  const fixed = Math.abs(num).toFixed(3);
  const [intPart, decPart] = fixed.split('.');
  const ip = intPart.padStart(3,'0');
  return [ip[0],ip[1],ip[2],decPart[0],decPart[1],decPart[2]];
}
function drawPlaceTable(num){
  const labels = ['百','十','一','．1','．2','．3'];
  const d = digitsOfPlace(num);
  let html='';
  for(let i=0;i<6;i++){
    if(i===3) html += `<div class="pcell point">．</div>`;
    const cls = i<3?'intpart':'decpart';
    html += `<div class="pcell ${cls}" data-i="${i}"><span>${d[i]}</span><span class="lbl">${labels[i]}</span></div>`;
  }
  document.getElementById('placeTable').innerHTML = html;
}
function animateSlide(op){
  const cells = document.querySelectorAll('#placeTable .pcell:not(.point)');
  const dir = op[0]==='×' ? 'slide-left' : 'slide-right';
  cells.forEach(c=>c.classList.add(dir));
}

/* ===================== モード②：単位変換（ポチ） ===================== */
function renderMode2(q, mode){
  const idx = (progress[mode].current%QUESTIONS[2].length)+1;
  const isLength = q.unitType==='length';
  const units = isLength ? ['t','km','m'] : ['t','kg','g'];
  content.innerHTML = `
    ${qBoxOpen(mode,q,idx,30,`${q.display} を ${q.targetUnit}単位で表しましょう。どのポチを点灯させる？`)}
    <div style="overflow-x:auto;"><svg id="axisSvg" width="600" height="160" viewBox="0 0 600 160"></svg></div>
    <div class="controls" id="confirmRow" style="display:none;">
      <input type="number" step="any" id="ansInput" placeholder="こたえ">
      <button class="btn" id="checkBtn">こたえる</button>
    </div>
    ${feedbackEl()}
  `;
  attachHint();
  drawAxis(q, units);
}
function drawAxis(q, units){
  const svg = document.getElementById('axisSvg');
  const xs = {0:80, 1:300, 2:520};
  let html = `<line x1="20" y1="80" x2="580" y2="80" stroke="#3DAA6E" stroke-width="3"/>`;
  units.forEach((u,i)=>{
    html += `<line x1="${xs[i]}" y1="60" x2="${xs[i]}" y2="100" stroke="#3DAA6E" stroke-width="3"/>`;
    html += `<text x="${xs[i]}" y="120" text-anchor="middle" font-size="16" fill="#333">${u}</text>`;
    html += `<circle class="pochi" id="pochi${i}" cx="${xs[i]}" cy="80" r="12" fill="#fff" stroke="#333" stroke-width="2"/>`;
  });
  q.digits.forEach((d,i)=>{
    html += `<text class="digit-col" x="${xs[Math.min(i,2)] + (i===2?0:0)}" y="30" text-anchor="middle"></text>`;
  });
  // place digits aligned: digit groups correspond to thousand/hundred/ten/one -> map roughly to axis spacing
  const digitXs = [220,300,380,460];
  q.digits.forEach((d,i)=>{
    html += `<text class="digit-col" x="${digitXs[i]}" y="35" text-anchor="middle">${d}</text>`;
  });
  svg.innerHTML = html;
  units.forEach((u,i)=>{
    const circ = document.getElementById('pochi'+i);
    circ.addEventListener('click', ()=>selectPochi(i, q));
    circ.addEventListener('touchstart', (e)=>{e.preventDefault(); selectPochi(i,q);});
  });
}
function selectPochi(i, q){
  const mode=2;
  for(let k=0;k<3;k++){
    const c = document.getElementById('pochi'+k);
    if(k===i) c.setAttribute('fill', i===q.pochiIndex ? '#3DAA6E' : '#D94F4F');
    else c.setAttribute('fill', '#fff');
  }
  const ok = i===q.pochiIndex;
  markResult(mode, q.id, ok);
  if(ok){
    document.getElementById('confirmRow').style.display='flex';
    const fb = document.getElementById('feedback');
    fb.className='feedback correct pop-in';
    fb.textContent = `〇 せいかい！ ${q.answer}${q.targetUnit}`;
    document.getElementById('checkBtn').addEventListener('click', ()=>{
      const v = parseFloat(document.getElementById('ansInput').value);
      const ok2 = Math.abs(v-q.answer)<1e-9;
      const fb2=document.getElementById('feedback');
      if(ok2){ fb2.textContent='〇 かんぺき！'; setTimeout(advanceQuestion,800); }
      else { fb2.textContent = `もう一度。正解は ${q.answer}${q.targetUnit}`; }
    });
  } else {
    const fb = document.getElementById('feedback');
    fb.className='feedback wrong pop-in';
    fb.textContent='✗ もういちど';
    if(wrongStreakOf(mode,q.id)>=3){
      fb.innerHTML += `<div style="font-size:0.9rem;">${q.hint}</div>`;
    }
  }
}

/* ===================== モード③：数直線 ===================== */
function renderMode3(q, mode){
  const idx = (progress[mode].current%QUESTIONS[3].length)+1;
  const text = q.kind==='read'
    ? `${q.targetLabel} の目盛りは何ですか。`
    : `${q.target} を表すめもりに ↑ を立てましょう。`;
  content.innerHTML = `
    ${qBoxOpen(mode,q,idx,30,text)}
    <div style="overflow-x:auto;"><svg id="lineSvg" width="700" height="160" viewBox="0 0 700 160"></svg></div>
    <div class="controls" id="readRow" style="display:${q.kind==='read'?'flex':'none'};">
      <input type="number" step="any" id="ansInput" placeholder="こたえ">
      <button class="btn" id="checkBtn">こたえる</button>
    </div>
    ${feedbackEl()}
  `;
  attachHint();
  drawNumberLine(q);
  if(q.kind==='read'){
    document.getElementById('checkBtn').addEventListener('click', ()=>{
      const v = parseFloat(document.getElementById('ansInput').value);
      const ok = Math.abs(v-q.answer) < q.step/2 + 1e-9;
      markResult(mode,q.id,ok);
      showFeedback(ok);
      if(!ok && wrongStreakOf(mode,q.id)>=3){
        document.getElementById('feedback').innerHTML += `<div style="font-size:0.9rem;">正解は <b>${q.answer}</b>。${q.hint}</div>`;
      }
    });
  }
}
let placedArrowValue = null;
function drawNumberLine(q){
  const svg = document.getElementById('lineSvg');
  const W=700,H=160,axisY=70,leftPad=60,rightPad=60;
  const usableW = W-leftPad-rightPad;
  const toX = v => leftPad + (v-q.min)/(q.max-q.min)*usableW;
  let html = `<line x1="${leftPad}" y1="${axisY}" x2="${W-rightPad}" y2="${axisY}" stroke="#333" stroke-width="2"/>`;
  const bigStep = (q.max-q.min)/10;
  for(let i=0;i<=10;i++){
    const v = q.min + bigStep*i;
    const x = toX(v);
    html += `<line x1="${x}" y1="${axisY-16}" x2="${x}" y2="${axisY+16}" stroke="#333" stroke-width="2"/>`;
    html += `<text x="${x}" y="${axisY+34}" text-anchor="middle" font-size="13">${Number(v.toFixed(4))}</text>`;
  }
  if(q.kind==='read'){
    Object.entries(q.marks).forEach(([label,val])=>{
      const x = toX(val);
      html += `<polygon points="${x-7},${axisY-26} ${x+7},${axisY-26} ${x},${axisY-12}" fill="#3DAA6E"/>`;
      html += `<text x="${x}" y="${axisY-32}" text-anchor="middle" font-size="14" font-weight="700">${label}</text>`;
    });
  } else {
    html += `<rect id="clickCatcher" x="${leftPad}" y="${axisY-30}" width="${usableW}" height="60" fill="transparent"/>`;
    if(placedArrowValue!==null){
      html += arrowSvg(toX(placedArrowValue), axisY);
    }
  }
  svg.innerHTML = html;
  if(q.kind==='place'){
    const catcher = document.getElementById('clickCatcher');
    const handler = (evX)=>{
      const rect = svg.getBoundingClientRect();
      const scaleX = W/rect.width;
      const xPx = (evX-rect.left)*scaleX;
      const raw = q.min + (xPx-leftPad)/usableW*(q.max-q.min);
      const snapped = Math.round(raw/q.step)*q.step;
      const clamped = Math.min(q.max, Math.max(q.min, snapped));
      if(placedArrowValue!==null && Math.abs(placedArrowValue-clamped)<q.step/2){
        placedArrowValue = null;
      } else {
        placedArrowValue = Number(clamped.toFixed(6));
      }
      drawNumberLine(q);
      checkPlaceAnswer(q);
    };
    catcher.addEventListener('click', e=>handler(e.clientX));
    catcher.addEventListener('touchstart', e=>{ e.preventDefault(); handler(e.touches[0].clientX); });
  }
}
function arrowSvg(x,axisY){
  return `<polygon points="${x-8},${axisY+40} ${x+8},${axisY+40} ${x+8},${axisY+22} ${x+14},${axisY+22} ${x},${axisY+6} ${x-14},${axisY+22} ${x-8},${axisY+22}" fill="#3DAA6E"/>`;
}
function checkPlaceAnswer(q){
  if(placedArrowValue===null) return;
  const mode=3;
  const ok = Math.abs(placedArrowValue - q.answer) <= q.step + 1e-9;
  markResult(mode,q.id,ok);
  showFeedback(ok);
  if(!ok && wrongStreakOf(mode,q.id)>=3){
    document.getElementById('feedback').innerHTML += `<div style="font-size:0.9rem;">${q.target} の場所だよ。${q.hint}</div>`;
  }
}

/* ===================== モード④：筆算 ===================== */
let hissanState = null; // {cols:[...], focusedCol:null}
function renderMode4(q, mode){
  const idx = (progress[mode].current%QUESTIONS[4].length)+1;
  content.innerHTML = `
    ${qBoxOpen(mode,q,idx,30,`${q.a} ${q.op} ${q.b} を筆算でしましょう。`)}
    <div style="overflow-x:auto;"><table class="hissan-table" id="hissanTable"></table></div>
    <div class="controls">
      <button class="btn" id="checkBtn">こたえる</button>
    </div>
    ${feedbackEl()}
  `;
  attachHint();
  buildHissan(q);
  document.getElementById('checkBtn').addEventListener('click', ()=>checkHissan(q,mode));
}
function toColsArray(num){
  const fixed = Math.abs(num).toFixed(3);
  const [ip,dp] = fixed.split('.');
  const ip3 = ip.padStart(3,' ');
  return [ip3[0],ip3[1],ip3[2],dp[0],dp[1],dp[2]];
}
function buildHissan(q){
  const aCols = toColsArray(q.a);
  const bCols = toColsArray(q.b);
  hissanState = {cols:new Array(6).fill(''), op:q.op};
  let rows='';
  // row a
  rows += '<tr><td></td>' + aCols.slice(0,3).map(c=>`<td class="given">${c.trim()}</td>`).join('') +
    `<td class="given point">．</td>` + aCols.slice(3).map(c=>`<td class="given">${c}</td>`).join('') + '</tr>';
  // row b with operator
  rows += `<tr class="opline"><td class="op-sign">${q.op}</td>` + bCols.slice(0,3).map(c=>`<td class="given">${c.trim()}</td>`).join('') +
    `<td class="given point">．</td>` + bCols.slice(3).map(c=>`<td class="given">${c}</td>`).join('') + '</tr>';
  // answer row
  rows += '<tr><td></td>' + [0,1,2].map(i=>`<td class="input-cell" data-i="${i}"></td>`).join('') +
    `<td class="point">．</td>` + [3,4,5].map(i=>`<td class="input-cell" data-i="${i}"></td>`).join('') + '</tr>';
  document.getElementById('hissanTable').innerHTML = rows;
  document.querySelectorAll('#hissanTable .input-cell').forEach(cell=>{
    cell.addEventListener('click', ()=>openNumpad(cell));
  });
}
function openNumpad(cell){
  numpad.innerHTML='';
  for(let n=0;n<=9;n++){
    const b=document.createElement('button');
    b.textContent=n;
    b.addEventListener('click', ()=>{
      cell.textContent=n;
      cell.classList.add('filled');
      hissanState.cols[parseInt(cell.dataset.i)] = String(n);
      numpadOverlay.classList.remove('show');
    });
    numpad.appendChild(b);
  }
  const clear=document.createElement('button');
  clear.textContent='クリア'; clear.className='clear';
  clear.addEventListener('click', ()=>{
    cell.textContent=''; cell.classList.remove('filled');
    hissanState.cols[parseInt(cell.dataset.i)]='';
    numpadOverlay.classList.remove('show');
  });
  numpad.appendChild(clear);
  const close=document.createElement('button');
  close.textContent='とじる'; close.className='close';
  close.addEventListener('click', ()=>numpadOverlay.classList.remove('show'));
  numpad.appendChild(close);
  numpadOverlay.classList.add('show');
}
function checkHissan(q, mode){
  const expected = toColsArray(q.answer).map((c,i)=> i<3 ? c.trim() : c);
  const got = hissanState.cols.map((c,i)=> i<3 ? (c||'0').trim() : (c||'0'));
  // normalize leading blanks in expected int part to '0' too for comparison fairness on leading zeros except leftmost
  const ok = [0,1,2,3,4,5].every(i=>{
    const e = expected[i]===''?'0':expected[i];
    const g = got[i]===''?'0':got[i];
    return e===g;
  });
  markResult(mode, q.id, ok);
  showFeedback(ok);
  if(!ok && wrongStreakOf(mode,q.id)>=3){
    const fb = document.getElementById('feedback');
    const ansStr = q.answer.toFixed(3).replace(/^0+(?=\d)/,'');
    fb.innerHTML += `<div style="font-size:0.9rem;">正解は <b>${q.answer}</b> だよ。桁をそろえて、足りない位は0で補おう。</div>`;
  }
}

/* ===================== まとめ画面 ===================== */
function renderSummary(mode){
  const p = progress[mode];
  const pct = Math.round(p.correct/p.total*100);
  let weakTag = '';
  if(p.wrong.length>0){
    if(mode===1) weakTag = '10倍・100倍の問題が苦手かも！';
    else if(mode===2) weakTag = '単位変換（ポチ）の問題が苦手かも！';
    else if(mode===3) weakTag = '数直線の読み取りが苦手かも！';
    else weakTag = '筆算の桁あわせが苦手かも！';
  }
  summaryModal.innerHTML = `
    <h2 style="color:var(--main);margin-top:0;">${modeName(mode)} まとめ</h2>
    <p>せいかい ${p.correct} / ${p.total} （${pct}%）</p>
    <svg width="220" height="40"><rect x="0" y="10" width="220" height="20" fill="#eee" rx="6"/><rect x="0" y="10" width="${220*pct/100}" height="20" fill="#3DAA6E" rx="6"/></svg>
    ${weakTag ? `<p><span class="tag">${weakTag}</span></p>` : '<p>パーフェクト！🎉</p>'}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
      ${p.wrong.length>0 ? `<button class="btn" id="retryBtn">まちがえた問題にもう一度チャレンジ</button>` : ''}
      <button class="btn secondary" id="closeSummaryBtn">とじる</button>
    </div>
  `;
  summaryOverlay.classList.add('show');
  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=>{
    summaryOverlay.classList.remove('show');
    retryWrong(mode);
  });
  document.getElementById('closeSummaryBtn').addEventListener('click', ()=>{
    summaryOverlay.classList.remove('show');
  });
}
</script>
